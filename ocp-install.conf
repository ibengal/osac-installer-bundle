# OpenShift installer settings.
# Literal values only; shell expansion is not supported.
# CLI options override values in this file.
#
# Fresh default layout: 3 compact nodes, each with 32 GiB RAM, 12 vCPU,
# an 80 GiB system disk, and a 150 GiB data disk.
# INPUTS_DIR=/opt/osac-inputs
# DEV_SCRIPTS_DIR=/opt/dev-scripts
# CI_TOKEN_FILE=/opt/osac-inputs/ci-token.txt
# PERSONAL_PULL_SECRET=/opt/osac-inputs/pull-secret.json
# CLUSTER_NAME=ostest
# BASE_DOMAIN=test.metalkube.org
# OPENSHIFT_RELEASE_TYPE=ga
# OPENSHIFT_VERSION=4.22.15
# NUM_MASTERS=3
# NUM_WORKERS=0
# MASTER_MEMORY=32768
# MASTER_VCPU=12
# MASTER_DISK=80
# VM_EXTRADISKS=true
# VM_EXTRADISKS_LIST="vdb"
# VM_EXTRADISKS_SIZE=150G
# WORKING_DIR=/opt/dev-scripts-work
# LOG_DIR=/tmp/ocp-install-logs
# HEALTH_TIMEOUT=1800
# STEP_TIMEOUT=7200
# CLEANUP_TIMEOUT=1800
# REPO_FILE=/opt/osac-inputs/host.repo
# USE_SUBSCRIPTION_MANAGER=false
# RHSM_ORG=123456
# RHSM_ACTIVATION_KEY_FILE=/opt/osac-inputs/rhsm-activation-key.txt

OPENSHIFT_RELEASE_TYPE=ga
OPENSHIFT_VERSION=4.22.15
HEALTH_TIMEOUT=1800

# Generic locations. Change these consistently with osac-install.conf.
DEV_SCRIPTS_DIR=/opt/dev-scripts
WORKING_DIR=/opt/dev-scripts-work
INPUTS_DIR=/opt/osac-inputs
CI_TOKEN_FILE=/opt/osac-inputs/ci-token.txt
PERSONAL_PULL_SECRET=/opt/osac-inputs/pull-secret.json
CLUSTER_NAME=ostest
