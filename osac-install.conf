# OSAC installer settings.
# Literal values only; shell expansion is not supported.
# CLI options override values in this file.
#
# Standalone install, teardown, and verification need KUBECONFIG here or
# --kubeconfig. The OCP-to-OSAC chain derives this path from OCP settings.
# OSAC_REPO defaults to the bundle's sibling osac-main/ when unset; this
# bundle sets an explicit generic checkout path below.
# OSAC_REPO_REF=main
# PROFILE=vmaas-ci
# NAMESPACE=osac
# INPUTS_DIR=/opt/osac-inputs
# AAP_LICENSE_FILE=/opt/osac-inputs/license.zip
# PULL_SECRET_FILE=/opt/osac-inputs/pull-secret.json
# INFRA_VALUES=/opt/osac-inputs/infra-values.yaml
# INSTANCE_VALUES=/opt/osac-inputs/instance-values.yaml
# VERIFY_TIMEOUT=600
# STEP_TIMEOUT=7200
# CLEANUP_TIMEOUT=600
# STATE_DIR=/opt/osac-installer-bundle/.astra-osac-state
# LOG_DIR=/tmp/astra-osac-install-logs
# CHAIN_LOG_DIR=/tmp/osac-install-chain-logs

# Generic locations. Keep KUBECONFIG aligned with CLUSTER_NAME and
# DEV_SCRIPTS_DIR in ocp-install.conf.
OSAC_REPO=/opt/osac-main
KUBECONFIG=/opt/dev-scripts/ocp/ostest/auth/kubeconfig
INPUTS_DIR=/opt/osac-inputs
